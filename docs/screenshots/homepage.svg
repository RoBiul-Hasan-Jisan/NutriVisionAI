<rect x="360" y="490" width="280" height="116" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
  <text x="384" y="536" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="30" fill="#2563EB">32</text>
  <text x="384" y="562" font-family="'Space Grotesk', Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">nutrients per dish</text>
<rect x="660" y="490" width="280" height="116" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
  <text x="684" y="536" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="30" fill="#2563EB">99.56%</text>
  <text x="684" y="562" font-family="'Space Grotesk', Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">conformal coverage</text>
<rect x="960" y="490" width="280" height="116" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
  <text x="984" y="536" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="30" fill="#16A34A">97.16%</text>
  <text x="984" y="562" font-family="'Space Grotesk', Inter, sans-serif" font-size="13" font-weight="600" fill="#0F172A">test top-1 accuracy</text>
  <text x="60" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B">01 &#8212; HOW IT DECIDES</text>
