  <text x="784" y="240" font-family="'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="44" fill="#0F766E">97.16%</text>
  <text x="784" y="266" font-family="'Space Grotesk', Inter, sans-serif" font-size="15" font-weight="600" fill="#0F172A">top-1 accuracy</text>
  <text x="784" y="292" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B">SigLIP-SO400M + EVA-02-L, averaged</text>
  <text x="784" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#64748B">25,250 test images sealed until final eval</text>
<rect x="760" y="356" width="220" height="92" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
