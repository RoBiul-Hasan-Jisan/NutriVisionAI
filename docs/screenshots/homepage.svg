  <text x="80" y="732" font-family="'Space Grotesk', Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Two backbones, averaged</text>
  <text x="80" y="754" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748B">SigLIP-SO400M and EVA-02-L scored, then parameter-free a</text>
<rect x="460" y="706" width="380" height="78" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
  <text x="480" y="732" font-family="'Space Grotesk', Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Calibrated, not confident</text>
  <text x="480" y="754" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748B">Temperature scaling cut expected calibration error eight</text>
<rect x="860" y="706" width="380" height="78" rx="14" fill="#FFFFFF" stroke="#E4E7ED" stroke-width="1"/>
  <text x="880" y="732" font-family="'Space Grotesk', Inter, sans-serif" font-size="14" font-weight="600" fill="#0F172A">It refuses to guess</text>
  <text x="880" y="754" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#64748B">Out-of-scope questions are declined in under 130ms.</text>

