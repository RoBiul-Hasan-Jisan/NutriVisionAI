  <text x="60" y="180" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#0F766E" letter-spacing="1.5">VISION · CONFORMAL PREDICTION · GROUNDED RETRIEVAL</text>
